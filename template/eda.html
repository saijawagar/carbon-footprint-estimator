<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Carbon Footprint Estimator{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-mark">CO2</span>
        <span>Carbon Footprint Estimator</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="{{ url_for('home') }}">Dashboard</a>
        <a href="{{ url_for('estimator') }}">Estimator</a>
        <a href="{{ url_for('eda') }}">EDA</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      Python for Data Science Assignment 5 | Carbon Footprint Estimator System
    </footer>
  </body>
</html>
